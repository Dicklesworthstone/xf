[package]
name = "xf"
version = "0.3.2"
edition = "2024"
resolver = "2"
authors = ["Jeffrey Emanuel <jeff@jeffreyemanuel.dev>"]
description = "Ultra-fast CLI for searching and querying X data archives"
repository = "https://github.com/Dicklesworthstone/xf"
homepage = "https://github.com/Dicklesworthstone/xf"
license = "MIT"
keywords = ["twitter", "x", "search", "cli", "archive", "tantivy"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
rust-version = "1.85"
exclude = [
    ".github/",
    ".beads/",
    "scripts/",
    "*.md",
    "!README.md",
]

[[bin]]
name = "xf"
path = "src/main.rs"

[dependencies]
# Core
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "signal"] }

# CLI
clap = { version = "4.5", features = ["derive", "cargo", "env", "unicode", "wrap_help"] }
clap_complete = "4.6"

# Terminal output (keep existing for fallback)
colored = "3.0"
indicatif = "0.18"
console = "0.16"

# Rich terminal output (optional)
rich_rust = { version = "0.2.0", optional = true }

# Terminal dimension detection
terminal_size = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"   # MessagePack serialization for daemon protocol
toml = "1.1"
toon_rust = { version = "0.2", package = "tru" }

# Database
rusqlite = { version = "0.39", features = ["bundled", "modern_sqlite"] }

# Full-text search
tantivy = "0.26"

# frankensearch (post-cutover: now required, migration complete per bd-3un.35)
frankensearch-core = { git = "https://github.com/Dicklesworthstone/frankensearch.git", package = "frankensearch-core" }
frankensearch-fusion = { git = "https://github.com/Dicklesworthstone/frankensearch.git", package = "frankensearch-fusion" }
frankensearch-index = { git = "https://github.com/Dicklesworthstone/frankensearch.git", package = "frankensearch-index" }
frankensearch-embed = { git = "https://github.com/Dicklesworthstone/frankensearch.git", package = "frankensearch-embed", features = ["hash", "model2vec", "fastembed"] }
asupersync = "0.3.1"

# High-performance text processing
regex = "1.10"
memchr = "2.7"
aho-corasick = "1.1"
unicode-normalization = "0.1"

# Semantic search / embeddings
half = "2.4"            # F16 quantization for vector storage
wide = "1.3"            # Portable SIMD for fast dot products
ring = "0.17"           # SHA256 for content hashing
# Pinned to rustls TLS features so `cargo build --release --target *-musl` and
# `cross-compile` runners do not need a system OpenSSL toolchain. Without these
# overrides fastembed/hf-hub/ort/ureq pull in openssl-sys, which fails on
# x86_64-unknown-linux-musl, aarch64-unknown-linux-{musl,gnu}, and
# x86_64-apple-darwin GitHub runners that lack openssl headers.
fastembed = { version = "5", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
    "online",
] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["download-binaries", "tls-rustls"] }
tokenizers = "0.23"     # HuggingFace tokenizers
ndarray = "0.17"        # N-dimensional arrays for ONNX tensors — kept in lockstep with ort's own ndarray version (ort 2.0.0-rc.12 uses ndarray 0.17) so array views pass directly into `TensorRef::from_array_view` without the "multiple different versions of crate ndarray" trait-bound mismatch.
safetensors = "0.7"     # Read Model2Vec embedding weights from safetensors format

# Parallelism
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"
num_cpus = "1.16"

# Utilities
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-english = "0.1"
dirs = "6.0"
fmmap = "0.4"
rand = "0.10"
rustyline = "18"
walkdir = "2.5"
glob = "0.3"
once_cell = "1.19"
itertools = "0.14"
textwrap = "0.16"
zip = "8.6"

# Tracing/logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

[build-dependencies]
vergen-gix = { version = "9", features = ["build", "cargo", "rustc"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.5"
futures = "0.3"
which = "8.0"
nix = { version = "0.31", features = ["signal", "process"] }
tokio-test = "0.4"
serial_test = "3.2"

[features]
default = []

# Enable rich_rust styled output
rich = ["dep:rich_rust"]

# Full feature set
full = ["rich"]

# Legacy colored output (uses colored crate, no rich_rust)
legacy-colors = []

# Existing features
parallel-search = []
alloc-count = []

[[bench]]
name = "search_perf"
harness = false

[profile.release]
opt-level = "z"     # Optimize for size (lean binary for distribution)
lto = true          # Link-time optimization across crates
codegen-units = 1   # Single codegen unit for better optimization
panic = "abort"     # Smaller binary, no unwinding overhead
strip = true        # Remove debug symbols

[profile.dev]
opt-level = 1       # Faster compile times during development

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
doc_markdown = "allow"
