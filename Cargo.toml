[package]
name = "xf"
version = "0.2.0"
edition = "2024"
resolver = "2"
authors = ["Jeffrey Emanuel <jeff@jeffreyemanuel.dev>"]
description = "Ultra-fast CLI for searching and querying X data archives"
repository = "https://github.com/Dicklesworthstone/xf"
homepage = "https://github.com/Dicklesworthstone/xf"
license = "MIT"
keywords = ["twitter", "x", "search", "cli", "archive", "tantivy"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
rust-version = "1.85"
exclude = [
    ".github/",
    ".beads/",
    "scripts/",
    "*.md",
    "!README.md",
]

[[bin]]
name = "xf"
path = "src/main.rs"

[dependencies]
# Core
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "signal"] }

# CLI
clap = { version = "4.5", features = ["derive", "cargo", "env", "unicode", "wrap_help"] }
clap_complete = "4.5"

# Terminal output (keep existing for fallback)
colored = "2.1"
indicatif = "0.17"
console = "0.15"

# Rich terminal output (optional)
rich_rust = { version = "0.1", optional = true }

# Terminal dimension detection
terminal_size = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"   # MessagePack serialization for daemon protocol
toml = "0.8"
toon_rust = { git = "https://github.com/Dicklesworthstone/toon_rust" }

# Database
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }

# Full-text search
tantivy = "0.22"

# High-performance text processing
regex = "1.10"
memchr = "2.7"
aho-corasick = "1.1"
unicode-normalization = "0.1"

# Semantic search / embeddings
half = "2.4"            # F16 quantization for vector storage
wide = "0.7"            # Portable SIMD for fast dot products
ring = "0.17"           # SHA256 for content hashing
fastembed = { version = "4.9", default-features = false, features = ["ort-download-binaries", "online"] }
ort = { version = "2.0.0-rc.9", features = ["download-binaries"] }  # ONNX Runtime for static embedding models
tokenizers = "0.21"     # HuggingFace tokenizers
ndarray = "0.16"        # N-dimensional arrays for ONNX tensors
safetensors = "0.5"     # Read Model2Vec embedding weights from safetensors format

# Parallelism
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"
num_cpus = "1.16"

# Utilities
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-english = "0.1"
dirs = "5.0"
fmmap = "0.4"
rand = "0.8"
rustyline = "12"
walkdir = "2.5"
glob = "0.3"
once_cell = "1.19"
itertools = "0.13"
textwrap = "0.16"
zip = "2.2"

# Tracing/logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

[build-dependencies]
vergen-gix = { version = "9", features = ["build", "cargo", "rustc"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[features]
default = []

# Enable rich_rust styled output
rich = ["dep:rich_rust"]

# Full feature set
full = ["rich"]

# Legacy colored output (uses colored crate, no rich_rust)
legacy-colors = []

# Existing features
parallel-search = []
alloc-count = []

[[bench]]
name = "search_perf"
harness = false

[profile.release]
opt-level = "z"     # Optimize for size (lean binary for distribution)
lto = true          # Link-time optimization across crates
codegen-units = 1   # Single codegen unit for better optimization
panic = "abort"     # Smaller binary, no unwinding overhead
strip = true        # Remove debug symbols

[profile.dev]
opt-level = 1       # Faster compile times during development

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
doc_markdown = "allow"
